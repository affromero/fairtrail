name: Gitleaks

# Scan the repository for committed secrets and keys on every push and PR.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan the complete pull request history
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          CAR_SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          CAR_SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$CAR_SCAN_BASE" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$CAR_SCAN_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin "$CAR_SCAN_BASE" "$CAR_SCAN_HEAD"
          gitleaks detect --redact --log-opts="$CAR_SCAN_BASE..$CAR_SCAN_HEAD"
